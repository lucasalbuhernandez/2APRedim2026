<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Status da Produção | VW REDIM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img class="banner" src="Banner.png" alt="">
    <h1>Rastreio em Tempo Real</h1>
</header>

<main class="container-login">
    <div class="login-card" style="text-align: center;">
        <h2 id="rastreio-aluno">Buscando...</h2>
        
        <div style="background: #111; padding: 30px; border-radius: 10px; border: 2px solid #ffcc00; margin: 20px 0;">
            <p style="text-transform: uppercase; font-size: 0.8em; color: #888; margin-bottom: 5px;">Status da Montagem:</p>
            <h1 id="status-atual" style="color: #ffcc00; margin: 0; letter-spacing: 2px;">CARREGANDO...</h1>
        </div>

        <div style="text-align: left; padding: 10px; background: #333; border-radius: 5px;">
            <ul id="detalhes-bike" style="list-style: none; padding: 0; margin: 0; line-height: 1.8; color: white;">
                </ul>
        </div>

        <div class="etapa" id="btn-voltar-selecao" style="cursor: pointer; margin-top: 20px; display: inline-block; padding: 10px 20px; background: #444; border-radius: 5px;">
            Fazer Novo Pedido
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
